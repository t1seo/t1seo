name: Generate calendar village
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maeul-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contributions and generate the calendar village
        uses: t1seo/maeul-in-the-sky@v2.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          username: 't1seo'
          village_style: 'korean'
          art_style: 'miniature'
          density: '6'
          write_snapshot: 'true'

      - name: Check calendar profile images and snapshot
        run: |
          test -s maeul-in-the-sky-dark.svg
          test -s maeul-in-the-sky-light.svg
          test -s maeul-in-the-sky.snapshot.json

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update calendar village'
          file_pattern: 'maeul-in-the-sky-dark.svg maeul-in-the-sky-light.svg maeul-in-the-sky.snapshot.json'

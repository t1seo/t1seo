name: Generate Maeul in the Sky Terrain
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: t1seo/maeul-in-the-sky@a1ff6d6e2bca72258b0f90e557c0a5b34ebc2a45
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          village_style: 'korean'
          art_style: 'miniature'
          density: '6'
          write_snapshot: 'true'

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update maeul-in-the-sky terrain'

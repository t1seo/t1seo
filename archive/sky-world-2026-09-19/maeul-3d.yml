name: Generate Maeul in the Sky Terrain
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: t1seo/maeul-in-the-sky@21c3d22af5a66ecdfbfa02fc781e043475a3efb9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          village_style: 'korean'
          art_style: 'miniature'
          density: '6'
          write_snapshot: 'true'

      - uses: t1seo/maeul-in-the-sky/profile@21c3d22af5a66ecdfbfa02fc781e043475a3efb9
        with:
          snapshot_path: 'maeul-in-the-sky.snapshot.json'
          output_dir: '.'

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update maeul-in-the-sky terrain'

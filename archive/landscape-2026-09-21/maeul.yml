name: Generate calendar and landscape villages
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maeul-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contributions and generate the calendar village
        uses: t1seo/maeul-in-the-sky@47df5c54b1d644f9447e1cb2c2e0fb306e8f7d9d
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          username: 't1seo'
          terrain_mode: 'calendar'
          village_style: 'korean'
          art_style: 'miniature'
          density: '6'
          write_snapshot: 'true'

      - name: Generate the landscape from the same contribution snapshot
        uses: t1seo/maeul-in-the-sky@47df5c54b1d644f9447e1cb2c2e0fb306e8f7d9d
        with:
          input: './maeul-in-the-sky.snapshot.json'
          output_dir: './landscape'
          terrain_mode: 'landscape'
          landscape_layout: 'island'
          preset: 'civilization'
          layout_seed: '41'
          motion: 'subtle'
          write_snapshot: 'true'

      - name: Check both profile images and snapshots
        run: |
          for directory in . landscape; do
            test -s "$directory/maeul-in-the-sky-dark.svg"
            test -s "$directory/maeul-in-the-sky-light.svg"
            test -s "$directory/maeul-in-the-sky.snapshot.json"
          done

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update landscape and calendar villages'
          file_pattern: 'maeul-in-the-sky-*.svg maeul-in-the-sky.snapshot.json landscape/*.svg landscape/*.snapshot.json'
